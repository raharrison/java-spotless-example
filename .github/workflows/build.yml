name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Apply formatting before building so the spotlessCheck that build runs passes
      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew --no-daemon spotlessApply build

      - name: Show formatting changes applied by Spotless
        run: git diff --stat
